apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: hpa-db-postgres
  namespace: dev-indri
  labels:
    project: indri
    app: db-postgres
    env: dev
    owner: nd
    team: platform
    costcenter: dev-indri
    object: hpa
    tag: hpa-db-postgres

spec:
  minReplicas: 1
  maxReplicas: 5

  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dep-db-postgres

  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80    

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 1
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
      - type: Percent
        value: 25
        periodSeconds: 60
      - type: Pods
        value: 1
        periodSeconds: 60  


  