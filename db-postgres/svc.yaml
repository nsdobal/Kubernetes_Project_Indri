apiVersion: v1
kind: Service

metadata:
  name: svc-postgres-db
  namespace: dev-indri
  labels:
    project: indri
    app: postgres-db
    env: dev
    owner: nd
    team: platform
    costcenter: dev-indri
    object: service
    tag: svc-postgres-db

spec:
  type: ClusterIP
  selector:
    pod: pod-db-postgres
  ports:
  - name: port-db-pgsql
    port: 5432
    targetPort: 5432